<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Login</title>
<style>
  body{font-family:Inter,Arial;background:#f2f2f7;margin:0;padding:0}
  .wrap{max-width:520px;margin:40px auto;padding:28px;background:#fff;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.06)}
  h1{margin:0 0 8px;font-size:28px}
  .field{width:100%;padding:12px;border-radius:8px;border:1px solid #d7dce6;margin-top:12px;font-size:15px}
  .btn{display:block;width:100%;padding:12px;border-radius:10px;background:#0066ff;color:#fff;border:0;margin-top:16px;font-size:16px}
  .msg{margin-top:12px;color:#b00020}
  a.small{display:inline-block;margin-top:12px;color:#5a2ea6}
</style>
</head>
<body>
  <div class="wrap">
    <h1>Login</h1>

    <div id="info" style="display:none" class="msg"></div>

    <form id="loginForm">
      <input name="username" id="username" class="field" placeholder="Username" autocomplete="username" required />
      <input name="password" id="password" class="field" placeholder="Password" type="password" autocomplete="current-password" required />
      <button class="btn" type="submit">Login</button>
    </form>

    <div>
      <a class="small" href="/register">Belum punya akun? Daftar</a>
    </div>
  </div>

<script>
(async function(){
  const f = document.getElementById('loginForm');
  const info = document.getElementById('info');

  // show error messages from querystring (e.g. ?error=invalid_credentials or ?registered=1)
  const qs = new URLSearchParams(location.search);
  if (qs.get('registered')) {
    info.style.display = 'block';
    info.style.color = '#0b6';
    info.textContent = 'Pendaftaran berhasil. Silakan login.';
  } else if (qs.get('error')) {
    info.style.display = 'block';
    info.style.color = '#b00020';
    info.textContent = decodeURIComponent(qs.get('error').replace(/\+/g,' '));
  }

  f.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    info.style.display = 'none';
    info.textContent = '';
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value;

    if (!u || !p) {
      info.style.display = 'block';
      info.style.color = '#b00020';
      info.textContent = 'Username dan password wajib diisi.';
      return;
    }

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        credentials: 'include',          // penting supaya cookie diset di browser
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p })
      });

      if (res.status === 200) {
        // success -> redirect to dashboard
        window.location.href = '/dashboard';
        return;
      }
      // parse JSON error message if ada
      let data;
      try { data = await res.json(); } catch(e){ data = null; }
      const msg = (data && data.error) ? data.error : `Login gagal (status ${res.status})`;
      info.style.display = 'block';
      info.style.color = '#b00020';
      // tampilkan pesan lebih readable
      if (msg === 'invalid_credentials') info.textContent = 'Username atau password salah.';
      else info.textContent = msg;
    } catch (err) {
      info.style.display = 'block';
      info.style.color = '#b00020';
      info.textContent = 'Terjadi kesalahan koneksi. Coba lagi.';
      console.error(err);
    }
  });
})();
</script>
</body>
</html>
