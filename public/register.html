<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Akun</title>
<style>
body { font-family: Arial; background: #f5f7fa; padding: 20px; }
.container { max-width: 380px; margin: auto; background: #fff; padding: 20px; border-radius: 12px; }
input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; }
button { width: 100%; background: #005cff; color: white; padding: 12px; border: 0; border-radius: 8px; cursor: pointer; }
.error { color: red; margin-top: 10px; font-size: 14px; }
</style>
</head>
<body>

<div class="container">
<h2>Buat Akun Baru</h2>

<input id="username" placeholder="Username">
<input id="wa" placeholder="No WhatsApp">
<input id="password" type="password" placeholder="Password">

<button onclick="register()">Daftar</button>

<p id="msg" class="error"></p>

<p style="margin-top:15px;">Sudah punya akun?  
<a href="/login.html">Login</a></p>
</div>

<script>
async function register() {
    const username = username.value.trim();
    const wa = wa.value.trim();
    const password = password.value.trim();

    if (!username || !wa || !password) {
        msg.textContent = "Semua field wajib diisi";
        return;
    }

    const res = await fetch("/api/register", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ username, wa, password })
    });

    const data = await res.json();
    msg.textContent = data.error || "Berhasil! Silakan login.";
}
</script>

</body>
</html>
