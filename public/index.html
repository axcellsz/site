<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Beranda</title>
<style>
  :root{
    --bg: #f2f4f8;
    --card: #fff;
    --accent: #0b63ff;
    --muted: #6b7280;
    --height-top: 64px;
    --height-bottom: 76px;
  }
  html,body{
    height:100%;
    margin:0;
    background:var(--bg);
    font-family: Inter, Roboto, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  /* TOP BAR (fixed) */
  .topbar{
    position:fixed;
    top:0; left:0; right:0;
    height:var(--height-top);
    background:linear-gradient(90deg,#e11d48,#ef4444); /* example */
    color:white;
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 16px;
    box-shadow:0 6px 20px rgba(2,6,23,0.08);
    z-index:30;
  }
  .topbar .left {
    display:flex; align-items:center; gap:12px;
  }
  .avatar{
    width:42px; height:42px; border-radius:10px; background:#fff3; display:inline-flex;
    align-items:center; justify-content:center; font-size:20px;
  }
  .greet{
    line-height:1;
  }
  .greet .hello{ font-size:12px; opacity:0.95; }
  .greet .name{ font-size:16px; font-weight:700; letter-spacing:-0.2px; }

  /* BOTTOM BAR (fixed) */
  .bottombar{
    position:fixed;
    left:0; right:0; bottom:0;
    height:var(--height-bottom);
    background:linear-gradient(180deg,#fff,#f7fafc);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 16px;
    gap:12px;
    box-shadow:0 -8px 30px rgba(2,6,23,0.06);
    z-index:30;
  }
  .bottombar .actions { display:flex; gap:10px; }
  .btn {
    background:var(--accent); color:white; border:none; padding:10px 14px;
    border-radius:10px; text-decoration:none; font-weight:600; display:inline-block;
    min-width:110px; text-align:center;
  }
  .btn.ghost{ background:transparent; color:var(--accent); border:1px solid rgba(11,99,255,0.12); }

  /* main content area between fixed bars */
  .content-wrap{
    /* make top & bottom safe space */
    padding-top: calc(var(--height-top) + 18px);
    padding-bottom: calc(var(--height-bottom) + 18px);
    min-height:100vh;
    box-sizing:border-box;
  }
  .container{
    max-width:780px;
    margin:0 auto;
    padding:0 18px;
  }

  .card{
    background:var(--card);
    border-radius:18px;
    padding:22px;
    box-shadow:0 8px 30px rgba(2,6,23,0.06);
    margin:24px 0;
  }

  /* banner */
  .banner{
    width:100%;
    height:160px;
    border-radius:14px;
    overflow:hidden;
    display:block;
    background:linear-gradient(90deg,#60a5fa,#06b6d4);
    margin-bottom:16px;
    object-fit:cover;
  }

  h1 { margin:0 0 8px 0; font-size:32px; }
  p.lead { color:var(--muted); margin:0 0 16px 0; font-size:15px; line-height:1.45; }

  /* responsiveness for small devices */
  @media (max-width:420px){
    :root { --height-top:60px; --height-bottom:76px; }
    .banner{ height:140px; }
    h1{ font-size:26px; }
    .btn{ min-width:88px; padding:10px 12px; }
  }
</style>
</head>
<body>

  <!-- TOP BAR -->
  <header class="topbar" role="banner">
    <div class="left">
      <div class="avatar">🌅</div>
      <div class="greet">
        <div class="hello">Selamat sore!</div>
        <div class="name">Pengunjung</div>
      </div>
    </div>
    <div style="margin-left:auto; display:flex; align-items:center; gap:12px;">
      <!-- small icon -->
      <div style="width:44px;height:44px;border-radius:44px;background:#fff;padding:6px;display:flex;align-items:center;justify-content:center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#ef4444" stroke-width="1.2"/></svg>
      </div>
    </div>
  </header>

  <!-- PAGE CONTENT (in between) -->
  <main class="content-wrap" role="main">
    <div class="container">

      <div class="card" style="text-align:left;">
        <!-- banner image: upload to /img/banner.png or change src -->
        <img class="banner" src="/img/banner.png" alt="Banner">
        <h1>Selamat datang</h1>
        <p class="lead">Halaman contoh yang responsive. Scroll konten ini — header & footer tetap di tempat.</p>

        <!-- example quick links -->
        <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:6px;">
          <a class="btn ghost" href="/register">Daftar</a>
          <a class="btn ghost" href="/login">Login</a>
          <!-- admin link only visible if you know URL -->
          <a class="btn ghost" href="/admin">Admin</a>
        </div>
      </div>

      <!-- additional sample content to show scrolling -->
      <div class="card">
        <h2>Fitur</h2>
        <p class="lead">Tambahkan konten lain di sini. Area ini akan menggulung jika panjang, header/footer tetap diam.</p>
      </div>

    </div>
  </main>

  <!-- BOTTOM BAR -->
  <nav class="bottombar" role="navigation" aria-label="Footer actions">
    <div style="display:flex; align-items:center; gap:12px;">
      <div style="font-weight:700; color:#111;">Home</div>
    </div>

    <div class="actions" style="margin-left:auto;">
      <!-- put login/register into bottom bar -->
      <a class="btn" href="/login">Login</a>
      <a class="btn ghost" href="/register">Daftar</a>
    </div>
  </nav>

</body>
</html>
