<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<style>
body { font-family: Arial; background: #eef1f5; padding: 20px; }
.container { max-width: 380px; margin: auto; background: #fff; padding: 20px; border-radius: 12px; }
input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; }
button { width: 100%; background: #005cff; color: white; padding: 12px; border: 0; border-radius: 8px; cursor: pointer; }
.error { color: red; margin-top: 10px; font-size: 14px; }
</style>
</head>
<body>

<div class="container">
<h2>Login</h2>

<input id="username" placeholder="Username">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<p id="msg" class="error"></p>

<p style="margin-top:15px;">
Belum punya akun? <a href="/register.html">Daftar</a>
</p>
</div>

<script>
async function login() {
    const username = username.value.trim();
    const password = password.value.trim();

    if (!username || !password) {
        msg.textContent = "Isi username & password";
        return;
    }

    const res = await fetch("/api/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ username, password })
    });

    const data = await res.json();

    if (data.error) msg.textContent = data.error;
    else window.location.href = "/home.html";
}
</script>

</body>
</html>
