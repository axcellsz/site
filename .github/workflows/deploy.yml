name: Deploy Worker + Upload Pages KV

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler v4
        run: npm install -g wrangler@4

      - name: Upload all files in /public to KV
        run: |
          set -euo pipefail

          echo "Uploading files using Wrangler v4..."

          for f in $(find public -type f); do
            key="${f#public/}"
            echo "Uploading $key"
            wrangler kv key put "$key" --binding PAGES_KV --path "$f"
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
