name: Deploy Worker + Upload Pages KV

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PAGES_DIR: public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Wrangler
        run: npm install -g wrangler@3

      - name: Upload public files to Pages_KV
        env:
          PAGES_KV_ID: ${{ secrets.PAGES_KV_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -d "$PAGES_DIR" ]; then echo "No $PAGES_DIR directory, skipping upload"; exit 0; fi
          cd "$PAGES_DIR"
          # upload files; key = relative path without leading ./
          find . -type f | while read -r f; do
            key="${f#./}"
            echo "Uploading $f -> $key"
            wrangler kv:key put --namespace-id "$PAGES_KV_ID" "$key" "$f"
          done

      - name: Publish Worker
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: wrangler deploy
