<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #eef1f7;
    margin: 0;
    padding: 0;
  }

  .container {
    max-width: 480px;
    margin: 50px auto;
    background: white;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
  }

  h1 {
    margin-top: 0;
    font-size: 28px;
    text-align: center;
    color: #222;
  }

  .box {
    margin-top: 25px;
    padding: 20px;
    background: #f7f9fc;
    border-radius: 12px;
    border: 1px solid #e1e5ec;
  }

  .label {
    font-size: 14px;
    color: #555;
    margin-bottom: 8px;
  }

  .value {
    font-size: 20px;
    font-weight: bold;
    color: #1a237e;
    margin-bottom: 6px;
  }

  .logout-btn {
    display: block;
    margin-top: 35px;
    width: 100%;
    padding: 14px;
    font-size: 16px;
    text-align: center;
    font-weight: bold;
    background: #ff3b30;
    color: white;
    border: none;
    border-radius: 9px;
    cursor: pointer;
    text-decoration: none;
  }
</style>
</head>
<body>

<div class="container">
  <h1>Dashboard</h1>

  <div class="box">
    <div class="label">Selamat datang,</div>
    <div class="value" id="username">Loading...</div>
  </div>

  <a href="/logout" class="logout-btn">Logout</a>
</div>

<script>
  // ambil username dari cookie (Worker sudah menyimpan sess)
  // Worker akan mengirim header X-User untuk dashboard
  fetch(window.location.href)
    .then(r => {
      let u = r.headers.get("X-User");
      if (!u) u = "User";
      document.getElementById("username").innerText = u;
    });
</script>

</body>
</html>
