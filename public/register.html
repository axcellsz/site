<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Daftar Akun</title>
<style>
  :root{--card:#fff;--accent:#0b6eff;}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto; background:#f3f6fb; margin:0; padding:24px;}
  .card{max-width:420px;margin:36px auto;padding:22px;border-radius:12px;background:var(--card);box-shadow:0 6px 20px rgba(10,20,50,0.06)}
  h1{margin:0 0 8px;font-size:22px}
  p.lead{margin:0 0 18px;color:#666}
  label{display:block;margin:10px 0 4px;color:#333;font-size:13px}
  input{width:100%;padding:12px;border-radius:10px;border:1px solid #d7dbe6;box-sizing:border-box;font-size:15px}
  button{margin-top:18px;width:100%;padding:12px;border-radius:10px;border:0;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
  .msg{margin-top:12px;font-size:14px}
  .error{color:#b00020}
  .success{color:#0a8a00}
</style>
</head>
<body>
  <div class="card" role="main">
    <h1>Buat Akun Baru</h1>
    <p class="lead">Daftar cepat — masukkan username, nomor WhatsApp, dan kata sandi.</p>

    <label for="username">Username</label>
    <input id="username" autocomplete="username" />

    <label for="whatsapp">No. WhatsApp</label>
    <input id="whatsapp" inputmode="tel" autocomplete="tel" placeholder="0812xxxxxxx" />

    <label for="password">Kata Sandi (min 8 karakter)</label>
    <input id="password" type="password" autocomplete="new-password" />

    <button id="btn">Daftar</button>

    <div id="msg" class="msg" aria-live="polite"></div>

    <p style="margin-top:14px;font-size:14px">Sudah punya akun? <a href="/login.html">Login</a></p>
  </div>

<script>
(() => {
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');

  function show(text, type='') {
    msg.textContent = text;
    msg.className = 'msg ' + (type ? type : '');
  }

  function validate(username, whatsapp, password) {
    if (!username || username.length < 3) return "Username minimal 3 karakter";
    if (!/^[0-9+\-\s]{7,20}$/.test(whatsapp)) return "Nomor WhatsApp tidak valid";
    if (!password || password.length < 8) return "Password minimal 8 karakter";
    return null;
  }

  btn.addEventListener('click', async (e) => {
    e.preventDefault();              // penting supaya tidak reload form
    show('Mengirim...', '');

    const username = document.getElementById('username').value.trim();
    const whatsapp = document.getElementById('whatsapp').value.trim();
    const password = document.getElementById('password').value;

    const v = validate(username, whatsapp, password);
    if (v) { show(v, 'error'); return; }

    try {
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, whatsapp, password })
      });

      const j = await res.json().catch(()=>({error:'invalid_response'}));

      if (!res.ok) {
        // tampilkan pesan error dari server bila ada
        show(j.error || j.message || ('Error: ' + res.status), 'error');
        return;
      }

      // sukses
      show('Berhasil! Mengalihkan...', 'success');
      // simpan token jika ada
      if (j.token) localStorage.setItem('token', j.token);
      setTimeout(()=> location.href = '/', 800);
    } catch (err) {
      show('Gagal menghubungi server: ' + (err.message||err), 'error');
    }
  });
})();
</script>
</body>
</html>
