<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Daftar</title>
  <style>
    body { font-family: Arial; background:#f2f2f7; }
    .box { max-width:420px;margin:40px auto;background:white;padding:30px;border-radius:16px; }
    input,button {
      width:100%;padding:14px;margin-top:12px;border-radius:8px;
      border:1px solid #ccc;font-size:16px;
    }
    button { background:#0057ff;color:white;border:none;font-size:18px;}
  </style>
</head>

<body>
<div class="box">
  <h2>Buat Akun Baru</h2>

  <!-- FORM TANPA JAVASCRIPT -->
  <form action="/api/register" method="post">

    <input name="username" placeholder="Username" required minlength="3" />
    <input name="whatsapp" placeholder="No WhatsApp" required />
    <input type="password" name="password" placeholder="Password" required minlength="6" />

    <button type="submit">Daftar</button>
  </form>

  <p>Sudah punya akun? <a href="/login">Login</a></p>
</div>
</body>
</html>
