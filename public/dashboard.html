<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard</title>
  <style>
    body { font-family: system-ui, Arial; background:#f2f4f8; margin:0; padding:30px }
    .card { max-width:640px; margin:40px auto; background:white; padding:28px; border-radius:18px; box-shadow:0 8px 24px rgba(10,20,40,0.06);}
    h1{margin:0 0 18px 0}
    .welcome { background:#f6f8fb; padding:18px; border-radius:10px; margin-bottom:18px; }
    .btn { display:block; width:100%; padding:14px; border-radius:12px; border:none; background:#ff3b30; color:white; font-size:18px; text-align:center; text-decoration:none;}
  </style>
</head>
<body>
  <div class="card">
    <h1>Dashboard</h1>
    <div class="welcome">
      <p>Selamat datang,</p>
      <p style="font-weight:700; font-size:20px; margin:8px 0;"><span id="username">{{USERNAME}}</span></p>
    </div>

    <!-- logout form -> POST /api/logout -->
    <form action="/api/logout" method="post">
      <button class="btn" type="submit">Logout</button>
    </form>
  </div>
</body>
</html>
