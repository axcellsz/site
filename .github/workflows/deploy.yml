name: Deploy Worker + Upload Pages KV (via API)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PAGES_DIR: public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (use Node 20 for wrangler v4)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler v4 (global)
        run: npm install -g wrangler@4

      - name: Validate required secrets
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Set secret CLOUDFLARE_API_TOKEN in repo settings}"
          : "${PAGES_KV_ID:?Set secret PAGES_KV_ID in repo settings}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set secret CLOUDFLARE_ACCOUNT_ID in repo settings}"

      - name: Upload public files to Pages_KV (via Cloudflare HTTP API)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAGES_KV_ID: ${{ secrets.PAGES_KV_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          if [ ! -d "$PAGES_DIR" ]; then
            echo "No $PAGES_DIR directory, skipping upload"
            exit 0
          fi

          cd "$PAGES_DIR"

          # iterate files and PUT them to the KV namespace via Cloudflare API
          find . -type f | while read -r f; do
            key="${f#./}"
            echo "Uploading $f -> $key"

            # detect content-type (basic)
            ext="${key##*.}"
            case "$ext" in
              html) ct="text/html; charset=utf-8" ;;
              css) ct="text/css" ;;
              js) ct="application/javascript" ;;
              json) ct="application/json" ;;
              svg) ct="image/svg+xml" ;;
              png) ct="image/png" ;;
              jpg|jpeg) ct="image/jpeg" ;;
              webp) ct="image/webp" ;;
              ico) ct="image/x-icon" ;;
              *) ct="application/octet-stream" ;;
            esac

            # Use Cloudflare Account-level API to put KV value
            # PUT /accounts/:account_id/storage/kv/namespaces/:namespace_id/values/:key
            curl -sS -X PUT "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${PAGES_KV_ID}/values/${key}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: ${ct}" \
              --data-binary @"${f}" \
              -o /tmp/cf-upload-response.json -w "\nHTTP_STATUS:%{http_code}\n"

            http_status=$(tail -n1 /tmp/cf-upload-response.json | sed -n 's/HTTP_STATUS://p' || true)
            # The curl -w wrote http status to stdout; the body is in file: we check last line
            if [ "$http_status" = "" ]; then
              # Fallback: inspect the file content for success flag
              ok=$(jq -r '.success // false' /tmp/cf-upload-response.json 2>/dev/null || echo "false")
            else
              ok=$(jq -r '.success // false' /tmp/cf-upload-response.json 2>/dev/null || echo "false")
            fi

            if [ "$ok" != "true" ]; then
              echo "Upload failed for $key. Response:"
              cat /tmp/cf-upload-response.json || true
              exit 1
            fi
          done

      - name: Publish Worker (wrangler deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          wrangler deploy
