name: Deploy Worker + Upload Pages KV

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PAGES_DIR: public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Wrangler v4 (global)
        run: |
          npm install -g wrangler@4

      - name: Upload public files to Pages_KV
        env:
          PAGES_KV_ID: ${{ secrets.PAGES_KV_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail

          # fallback to CF_API_TOKEN if CLOUDFLARE_API_TOKEN not provided
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CF_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN not set, falling back to CF_API_TOKEN"
            export CLOUDFLARE_API_TOKEN="$CF_API_TOKEN"
          fi

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "ERROR: No Cloudflare API token found. Set secret CLOUDFLARE_API_TOKEN (preferred) or CF_API_TOKEN (fallback)." >&2
            exit 1
          fi

          if [ -z "${PAGES_KV_ID:-}" ]; then
            echo "ERROR: PAGES_KV_ID secret not set." >&2
            exit 1
          fi

          if [ ! -d "$PAGES_DIR" ]; then
            echo "No $PAGES_DIR directory, skipping upload"
            exit 0
          fi

          cd "$PAGES_DIR"

          echo "Uploading files from $(pwd) to KV namespace $PAGES_KV_ID using wrangler v4"
          # Upload each file; use --path to point to file contents
          find . -type f | while read -r f; do
            key="${f#./}"
            echo "Uploading $f -> $key"
            wrangler kv:key put --namespace-id "$PAGES_KV_ID" "$key" --path "$f"
          done

      - name: Publish Worker (wrangler v4)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CF_API_TOKEN:-}" ]; then
            export CLOUDFLARE_API_TOKEN="$CF_API_TOKEN"
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "ERROR: No Cloudflare API token found. Set secret CLOUDFLARE_API_TOKEN (preferred) or CF_API_TOKEN (fallback)." >&2
            exit 1
          fi
          wrangler deploy
